<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Details - ProjectBridge</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .project-box {
            background: white;
            padding: 35px;
            border-radius: 16px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        .project-title {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .category {
            display: inline-block;

            background: #dbeafe;
            color: #1d4ed8;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 25px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        .section p {
            color: #475569;
            line-height: 1.6;
        }

        .tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech span {
            background: #e2e8f0;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .protected {
            background: #fff7ed;
            border: 1px solid #fed7aa;

            padding: 20px;

            border-radius: 10px;

            margin-top: 25px;
        }

        .protected h3 {
            color: #c2410c;
            margin-bottom: 8px;
        }

        .protected p {
            color: #7c2d12;
            line-height: 1.5;
        }

        .contact-box {
            background: #eff6ff;

            padding: 25px;

            border-radius: 12px;

            margin-top: 25px;

            text-align: center;
        }

        .contact-box h2 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .contact-box p {
            color: #475569;
            margin-bottom: 18px;
        }

        .request-btn {
            background: #2563eb;

            color: white;

            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .request-btn:hover {
            background: #1d4ed8;
        }

        .success {
            margin-top: 15px;

            color: #15803d;

            font-weight: bold;
        }

    </style>

</head>


<body>


<nav>

    <div class="logo">
        ProjectBridge
    </div>

    <a
        href="explore-projects.html"
        class="back"
    >
        ← Explore Projects
    </a>

</nav>


<div class="container">

    <div
        class="project-box"
        id="projectContainer"
    >

    </div>

</div>


<script>


const user = JSON.parse(
    localStorage.getItem("projectBridgeUser")
);


if (!user || user.role !== "company") {

    window.location.href = "login.html";

}


const params =
    new URLSearchParams(window.location.search);


const projectId =
    Number(params.get("id"));


const projects = JSON.parse(

    localStorage.getItem(
        "projectBridgeProjects"
    )

) || [];


const project =
    projects.find(
        project => project.id === projectId
    );


const container =
    document.getElementById(
        "projectContainer"
    );


if (!project) {

    container.innerHTML = `

        <h2>Project not found ❌</h2>

        <p>
            This project may have been removed.
        </p>

    `;

} else {


    container.innerHTML = `

        <h1 class="project-title">
            ${project.projectName}
        </h1>

        <span class="category">
            ${project.category}
        </span>


        <div class="section">

            <h3>
                📖 Project Overview
            </h3>

            <p>
                ${project.description}
            </p>

        </div>


        <div class="section">

            <h3>
                💻 Technologies
            </h3>

            <div class="tech">

                ${project.technologies
                    .split(",")
                    .map(
                        tech =>
                        `<span>${tech.trim()}</span>`
                    )
                    .join("")
                }

            </div>

        </div>


        <div class="section">

            <h3>
                👥 Team
            </h3>

            <p>
                ${project.team}
            </p>

        </div>


        <div class="section">

            <h3>
                🏆 Achievement
            </h3>

            <p>
                ${project.achievement || "Not provided"}
            </p>

        </div>


        <div class="protected">

            <h3>
                🔒 Protected Project Information
            </h3>

            <p>

                Detailed implementation,
                business strategy and other
                sensitive project information
                are protected by ProjectBridge.

                <br><br>

                Companies must request access
                from the project owner before
                receiving protected information.

            </p>

        </div>


        <div class="contact-box">

            <h2>
                Interested in this project? 🤝
            </h2>

            <p>

                Send a request to connect
                with the project owner.

            </p>

            <button
                class="request-btn"
                onclick="requestContact()"
            >
                📩 Request Contact
            </button>

            <div
                class="success"
                id="successMessage"
            ></div>

        </div>

    `;

}


function requestContact() {


    let requests = JSON.parse(

        localStorage.getItem(
            "projectBridgeRequests"
        )

    ) || [];


    const alreadyRequested =
        requests.some(

            request =>
                request.projectId === project.id &&
                request.companyEmail === user.email

        );


    if (alreadyRequested) {

        document.getElementById(
            "successMessage"
        ).textContent =
            "You have already requested contact for this project.";

        return;

    }


    const request = {

        id: Date.now(),

        projectId: project.id,

        projectName:
            project.projectName,

        studentName:
            project.owner,

        studentEmail:
            project.ownerEmail,

        companyName:
            user.name,

        companyEmail:
            user.email,

        status:
            "Pending"

    };


    requests.push(request);


    localStorage.setItem(

        "projectBridgeRequests",

        JSON.stringify(requests)

    );


    document.getElementById(
        "successMessage"
    ).textContent =
        "✅ Contact request sent successfully!";

}


</script>


</body>

</html>
